name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:

  examples:
    runs-on: ubuntu-latest
    name: Test ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project:
          - helia-101
          - helia-browser-verified-fetch
          - helia-cjs
          - helia-electron
          - helia-esbuild
          - helia-jest
          - helia-jest-typescript
          - helia-nestjs
          - helia-nextjs
          - helia-parcel
          - helia-remote-pinning
          - helia-script-tag
          - helia-ts-node
          - helia-typescript
          - helia-vite
          - helia-vue
          - helia-webpack
          - helia-create-car
          - helia-lan-discovery
    defaults:
      run:
        working-directory: examples/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx -y playwright install --with-deps
        # This step has been observed to either complete in under a minute or to
        # hang indefinitely when failing to install browsers/os updates
        timeout-minutes: 10
      - name: Run tests
        run: npm run test
        # This step has been observed to hang indefinitely when the browsers
        # weren't correctly downloaded.
        timeout-minutes: 10

  deno:
    runs-on: ubuntu-latest
    name: Test ${{ matrix.project }} on Deno
    strategy:
      fail-fast: false
      matrix:
        project:
          - helia-101
    defaults:
      run:
        working-directory: examples/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: deno install --allow-scripts
      - name: Run tests
        run: deno task test
        env:
          NODE_EXEC: deno

  monorepo:
    runs-on: ubuntu-latest
    name: Test monorepo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx -y playwright install --with-deps
        # This step has been observed to either complete in under a minute or to
        # hang indefinitely when failing to install browsers/os updates
        timeout-minutes: 10
      - name: Run linting
        run: npm run lint
      - name: Run tests
        run: npm run test -- --concurrency 1
        # This step has been observed to hang indefinitely when the browsers
        # weren't correctly downloaded.
        timeout-minutes: 10
